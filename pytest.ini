[pytest]
# Collect only the purpose-built pytest tests under scripts/tests/. The many
# standalone `scripts/test_*.py` / `agents/scripts/test_*.py` suites use a
# `_run_all()` + __main__ convention (and some take helper default-args that
# pytest would mistake for fixtures); test_standalone_suites.py runs each of
# them as a subprocess so CI exercises everything through one `pytest` call (#8).
testpaths = scripts/tests
python_files = test_*.py
python_functions = test_*
