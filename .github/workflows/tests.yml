name: tests

# Runs the harness test suite (pytest) on push and PR. This is the repo's first
# CI, added in #8. Hardened: read-only token, no secrets exposed, minimal deps.
"on":
  push:
  pull_request:

# Least privilege: the suite only reads the checkout.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs (supply-chain hardening, #48): a moved or
      # compromised major tag can't inject into CI. Update the SHA + comment
      # together when bumping; resolve a tag via the GitHub API's
      # /repos/<owner>/<repo>/git/ref/tags/<tag> endpoint.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4 tag @ 2026-07-16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 tag @ 2025-04-24
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: pytest -q
